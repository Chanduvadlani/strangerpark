<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StrangerPark | Supabase Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h2>🌳 StrangerPark</h2>
  <p><span id="onlineCount">0</span> strangers online</p>
</div>

<div id="loginBox" class="container">
  <button onclick="guestLogin()" class="btn-primary">Continue as Guest</button>
</div>

<div id="profileBox" class="container" style="display:none;">
  <h3>Set Your Preferences</h3>
  <select id="gender">
    <option value="male">I am Male</option>
    <option value="female">I am Female</option>
  </select>
  <select id="looking">
    <option value="female">Looking for Female</option>
    <option value="male">Looking for Male</option>
  </select>
  <input id="interest" placeholder="Interests (e.g. music, coding)">
  <button onclick="startMatching()" class="btn-success">Start Chatting</button>
</div>

<div id="waitingBox" class="container" style="display:none;">
  <div class="loader"></div>
  <p>Searching for a stranger...</p>
</div>

<div id="chatBox" style="display:none;">
  <div class="videos">
    <video id="myVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div class="controls">
    <button onclick="toggleMic()" id="micBtn">🎙 Mic ON</button>
    <button onclick="toggleCam()" id="camBtn">🎥 Cam ON</button>
    <button onclick="nextStranger()" class="btn-next">⏭ Next</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
